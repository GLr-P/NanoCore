name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and unit tests
        run: mvn -B -ntp verify
      - name: Boot test on a real Paper server
        run: bash tools/smoke-test.sh target/NanoCore-*.jar 26.3
      - uses: actions/upload-artifact@v4
        with:
          name: NanoCore
          path: target/NanoCore-*.jar
