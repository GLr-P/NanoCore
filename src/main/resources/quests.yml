# Quest kinds the board picks from. Reload with /nanocore reload (the board itself changes at the next refresh).
#
# Each entry:
#   category:  quests of the same category are spread out (no two on one board when there's a choice)
#   name:      shown on the board; "<variant>" is replaced by the variant's label
#   icon:      item shown in the menu
#   count:     stat counters that add progress (see /nanocore stats <player>), or
#   deliver:   an item to hand in at the board (it goes into the town storehouse), or
#   biome / structure: places to visit (biome or structure ids)
#   easy / medium / hard: how many are asked for (a range picks a random amount; the reward scales with it)
#   community: amount for the server-wide weekly quest (the whole server works on it together)
#   requires:  milestone that must be unlocked first (nether, end, elytra, netherite...)
#   scale:     raw units per shown unit (distances are counted in centimetres, so 100 = blocks)
#   weight:    how often it's picked compared to the others (default 1)
#   variants:  kinds of the same quest; one is picked each time (label, icon and their own count/deliver/biome)

