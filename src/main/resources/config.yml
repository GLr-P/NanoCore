# NanoCore settings. Everything here can also be changed in game: /nc > Settings (changes save to this file).
# After editing this file by hand: /nc > Settings > Reload, or /nc reload. The database file needs a restart.

# Greet players on their first join with buttons for the menu (/nc), the guide and the commands.
welcome-message: true

currency:
  singular: coin
  plural: coins
  # Money every new player starts with.
  starting-balance: 100

milestones:
  # Players in the Nether above this height are sent back down while the Nether roof is locked.
  nether-roof-y: 127

admin-shop:
  # The server only buys (/sell), never sells. Most a player can earn from it per day.
  daily-limit: 150
  # When the daily limit starts over, 24-hour time.
  reset-time: "00:00"
  # Time zone for the reset, like America/Vancouver. Empty = the server's own.
  timezone: ""
  # Item id: coins each. Add "requires: <milestone>" to only buy it after that milestone.
  # Only list things that can't be farmed, automated or duplicated.
  prices:
    diamond: 6
    diamond_block: 54
    diamond_ore: 6
    deepslate_diamond_ore: 6
    echo_shard: 10
    disc_fragment_5: 4
    heart_of_the_sea: 40
    enchanted_golden_apple: 60
    heavy_core: 80
    dragon_head: 50
    ancient_debris: { price: 20, requires: netherite }
    netherite_scrap: { price: 20, requires: netherite }
    netherite_ingot: { price: 90, requires: netherite }
    elytra: { price: 150, requires: elytra }

quests:
  # Quests on the daily board per difficulty (at most 7 each). The kinds of quests are in quests.yml.
  board: { easy: 5, medium: 4, hard: 2 }
  # Coins per difficulty. Inside a range, quests that ask for more pay more.
  rewards: { easy: 40-80, medium: 120-200, hard: 300-500 }
  # Quests a player can have going at once.
  max-active: 3
  # Coins to swap a quest on your board for a different one (0 = free).
  reroll-cost: 25
  # When the daily board changes, 24-hour time. Quests done but not claimed are paid out then.
  refresh-time: "06:00"
  # Time zone for the refresh, like America/Vancouver. Empty = the server's own.
  timezone: ""
  community:
    # The weekly server-wide quest: this pot is split by how much each player helped.
    pot: 1500
    # Everyone who helped gets at least this.
    min-share: 25
    # The day the community quest changes (at refresh-time).
    day: monday
  # Height of the floating label above each board block.
  label-height: 1.8
  # /quests counts as standing at the board within this many blocks of one.
  board-reach: 6

player-shops:
  # Shops each player can have (admins have no limit).
  limit: 10
  # Percent of every player shop sale that disappears, so money doesn't pile up. 0 = none.
  tax-percent: 2
  # Seconds you have to right-click your chest after clicking "New shop".
  pick-seconds: 30

events:
  # The kinds of events are in events.yml (and any .yml file in the events folder next to it).
  auto:
    # Pick a random event from the pool every day.
    enabled: true
    # When it's announced (sign-up opens) and when it starts, 24-hour time.
    announce-time: "12:00"
    start-time: "19:00"
    # The same event won't be picked again within this many days.
    no-repeat-days: 5
  # Time zone for these times, like America/Vancouver. Empty = the server's own.
  timezone: ""
  # Chat reminders this many minutes before an event starts.
  reminders: [10, 1]
  # Standard prizes (each event can set its own).
  prizes:
    places: [250, 150, 100]
    participation: 25
    trophy: true
    trophy-item: gold_ingot
    # Counted actions (blocks, kills, steps...) needed to count as taking part, so AFK players get nothing.
    active-actions: 20
  discord:
    # A channel webhook URL (Channel settings > Integrations > Webhooks). Keep it secret: set it only on the server.
    webhook-url: ""
    username: "Server events"

stats:
  # How often counters are saved to the database, in seconds.
  save-every-seconds: 30
  # Count stats for players in creative or spectator mode (normally off).
  count-creative: false

storage:
  file: nanocore.db
