welcome:
  - "<dark_gray>--------------------------------"
  - "<gold><bold>Welcome, <player>!</bold></gold> <gray>This server plays like vanilla, with quests, events, player shops and milestones."
  - "<click:run_command:'/nc'><hover:show_text:'Open the menu'><green>[Open the menu]</green></hover></click> <click:run_command:'/nc guide'><hover:show_text:'How the server works'><yellow>[Read the guide]</yellow></hover></click> <click:run_command:'/nc help'><hover:show_text:'Every command'><aqua>[All commands]</aqua></hover></click>"
  - "<gray>You can always type <white>/nc</white> for the menu."
  - "<dark_gray>--------------------------------"

guide:
  title: "Server guide"
  author: "NanoCore"
  pages:
    - "<gold><bold>Welcome!</bold></gold>\n\n<black>This server feels vanilla, with a few extras:\n\n- coins\n- a quest board\n- player shops\n- events\n- milestones\n\nType <dark_green>/nc</dark_green> for a menu with all of it, and <dark_green>/nc help</dark_green> for every command."
    - "<gold><bold>Coins</bold></gold>\n\n<black>You earn coins from <dark_green>quests</dark_green> and by selling to other players in <dark_green>shops</dark_green>.\n\nThe server buys a few rare items with <dark_green>/sell</dark_green>, but only a little each day.\n\n/balance, /pay, /baltop"
    - "<gold><bold>Quests</bold></gold>\n\n<black>The quest board in town has new quests every morning: easy, medium and hard.\n\nRight-click it, take up to 3, do them, then claim your coins there.\n\nThere's also a weekly community quest everyone helps with."
    - "<gold><bold>Player shops</bold></gold>\n\n<black>Place a chest, fill it, hold the item and type <dark_green>/pshop</dark_green> > New shop, then right-click the chest.\n\nSet the price in the window. Others right-click to buy, even while you're offline."
    - "<gold><bold>Events</bold></gold>\n\n<black>Most days there's an event in the evening: mining, fishing, hunts, races, builds and more.\n\nJoin with the [Join] button or <dark_green>/event join</dark_green>. Winners get coins and a trophy."
    - "<gold><bold>Milestones</bold></gold>\n\n<black>The Nether, the End, netherite, elytra and shops start locked.\n\nEach one opens at a big server event that everyone plays together.\n\n<dark_green>/milestones</dark_green> shows what's open."

