# Player-facing text. MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Placeholders are written like <amount>. Reload with /nanocore reload.

prefix: "<gray>"

economy:
  balance-self: "<gray>Balance: <gold><balance></gold>"
  balance-other: "<gray><player>'s balance: <gold><balance></gold>"
